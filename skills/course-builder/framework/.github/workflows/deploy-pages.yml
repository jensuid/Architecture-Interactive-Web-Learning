name: Deploy Interactive Courses

on:
  workflow_dispatch:
    inputs:
      confirm_beta_deployment:
        description: "Deploy this beta revision"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    name: Guard beta deployment
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit deployment confirmation
        run: |
          if [ "${{ inputs.confirm_beta_deployment }}" != "true" ]; then
            echo "Beta deployment is paused. Run validation CI and deploy manually after review."
            exit 1
          fi

  build:
    name: Build and validate static distribution
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/tests/package-lock.json

      - name: Install headless test dependencies
        working-directory: template/tests
        run: npm ci

      - name: Run full validation and publish
        run: node template/scripts/agent-run.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
